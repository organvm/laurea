name: arena-table

on:
  push:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: arena-table-publication
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Render all accepted observations
        run: |
          python -m pip install -e .
          mkdir -p arena/entries
          laurea arena-table --entries arena/entries --baseline arena/baseline.json
      - name: Prepare table through the PR rail
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m laurea.publish --kind arena-table --refresh-table
