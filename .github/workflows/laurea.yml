name: laurea

on:
  schedule:
    - cron: "17 9 * * *" # daily, 09:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "tests/**", "pyproject.toml", ".github/workflows/laurea.yml"]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: laurea-publication
  cancel-in-progress: false

jobs:
  laurels:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: pip install -e '.[test]'
      - run: python -m pytest tests -q
      - name: Recompute the laurels
        env:
          # A user PAT (LAUREA_TOKEN secret) also counts private contributions;
          # the default token still measures the full public estate.
          LAUREA_TOKEN: ${{ secrets.LAUREA_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The canonical repository tracks Anthony. Personal copies default to
          # their owner; organization-owned copies set the LAUREA_LOGIN variable
          # to the user account they are explicitly authorized to measure.
          LAUREA_LOGIN: ${{ github.repository == 'organvm/laurea' && '4444J99' || vars.LAUREA_LOGIN || github.repository_owner }}
        run: laurea run --login "$LAUREA_LOGIN"
      - name: Prepare refreshed assets PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: python -m laurea.publish --kind metrics --refresh-pending
