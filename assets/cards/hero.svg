    <text class="ev" text-anchor="middle" x="60" y="24"><tspan x="60" dy="0">pull requests opened</tspan><tspan x="60" dy="14">trailing 12 months</tspan></text>
  </g>
  <g class="fade d4" transform="translate(610, 160)">
