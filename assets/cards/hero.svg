    <text class="ev" text-anchor="middle" x="60" y="24"><tspan x="60" dy="0">non-fork repositories</tspan><tspan x="60" dy="14">visible corpus</tspan></text>
  </g>
  <g class="fade d3" transform="translate(430, 160)">
