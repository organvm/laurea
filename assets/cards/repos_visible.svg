<svg xmlns="http://www.w3.org/2000/svg" width="420" height="170" viewBox="0 0 420 170" role="img" aria-label="Visible non-fork repository corpus: measured">
  <style>
    .t { font: 600 15px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .big { font: 700 34px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e3b341; }
    .status { font: 700 13px 'Segoe UI', Helvetica, Arial, sans-serif; letter-spacing: 1px; }
    .ev { font: 400 12px 'Segoe UI', Helvetica, Arial, sans-serif; fill: #8b949e; }
    .fade { opacity: 1; }
  </style>
  <defs>
  <linearGradient id="shL" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" stop-color="#9e7b2a"/>
    <stop offset="50%" stop-color="#e3b341">
      <animate attributeName="offset" values="0.2;0.8;0.2" dur="6s" repeatCount="indefinite"/>
    </stop>
    <stop offset="100%" stop-color="#9e7b2a"/>
  </linearGradient>
</defs>
  <rect width="419" height="169" x="0.5" y="0.5" rx="10" fill="#161b22" stroke="#30363d"/>
  <text class="t fade" x="24" y="34">Visible non-fork repository corpus</text>
  <text class="status fade d1" x="396" y="34" text-anchor="end" fill="#e3b341">MEASURED</text>
  <text class="big fade d1" x="24" y="76">290</text>
  <text class="ev fade d2" x="93" y="76">repositories</text>
  <text class="ev fade d2" x="24" y="104">290 non-fork repositories were visible across the personal</text><text class="ev fade d3" x="24" y="120">account and 10 organization memberships returned by the</text><text class="ev fade d4" x="24" y="136">API</text>
</svg>
