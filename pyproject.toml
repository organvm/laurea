[project]
name = "laurea"
version = "0.2.0"
description = "Provenance-bearing GitHub activity snapshots and bounded SVG reports. Zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Anthony James Padavano" }]
keywords = ["github", "metrics", "provenance", "portfolio", "svg", "badges"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
laurea = "laurea.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
